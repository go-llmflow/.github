name: Renovate

on:
  schedule:
    # Staggered against the other organisations' runners. Scheduled runs on
    # this account fire hours behind their cron whatever is asked for, so the
    # exact minute matters less than not asking at the same instant as a
    # neighbour.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Renovate
        uses: renovatebot/github-action@1376d90bcd3a4d4e7393ae762eea56ac684aee38 # v48.0.0
        with:
          configurationFile: config.js
          # Exact, not the action's floating default `44`: ci.yml validates
          # config.js with this same version (RENOVATE_VERSION there), so the
          # validator that judges the config and the engine that runs it agree.
          # Raise both together.
          renovate-version: 44.264.1
          # ⛔ RENOVATE_TOKEN must exist as a repository secret on this
          # repository. An unset secret expands to the empty string and the
          # action then fails with "'token' MUST be passed using its input or
          # the 'RENOVATE_TOKEN' environment variable" — in about ten seconds,
          # every night, which reads as activity to any check that only asks
          # whether runs happen. Sixteen organisations were in that state on
          # 2026-10-31, none of which had ever received a dependency update.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
